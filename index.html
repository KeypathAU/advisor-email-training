<style>
  :root {
    --paper:      #F7F1E8;
    --surface:    #FFFFFF;
    --surface-2:  #EFE6D8;
    --ink:        #1A1725;
    --ink-2:      #4F4860;
    --ink-3:      #857D94;
    --rule:       #DED3C4;
    --rule-soft:  #EBE2D5;

    --accent:     #DC4A40;
    --accent-2:   #E8A317;
    --accent-wash:#FBE3DF;
    --on-accent:  #FFFFFF;
    --on-accent-2:#1A1725;

    --panel-bg:    #1A1725;
    --panel-fg:    #F7F1E8;
    --panel-accent:#F2B138;

    --strong:     #147F63;
    --strong-wash:#DDF0E8;
    --okay:       #B87A12;
    --okay-wash:  #FAEBD1;
    --weak:       #8B819C;
    --weak-wash:  #ECE7F0;

    --shadow: 0 2px 0 rgba(26, 23, 37, 0.10);
    --shadow-up: 0 6px 0 rgba(26, 23, 37, 0.13);

    --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --f-ui: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --f-mail: "Source Serif 4", Georgia, "Times New Roman", serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #14111C;
      --surface:    #1F1A2B;
      --surface-2:  #2A2438;
      --ink:        #F2ECE4;
      --ink-2:      #BDB4CC;
      --ink-3:      #8B82A0;
      --rule:       #362E48;
      --rule-soft:  #261F35;
      --accent:     #FF6E62;
      --accent-2:   #FFC24D;
      --accent-wash:#3B2029;
      --on-accent:  #1A0F10;
      --on-accent-2:#1A1725;

      --panel-bg:    #2A2438;
      --panel-fg:    #F2ECE4;
      --panel-accent:#FFC24D;
      --strong:     #47C79C;
      --strong-wash:#123328;
      --okay:       #E7AB4C;
      --okay-wash:  #33260F;
      --weak:       #948AA6;
      --weak-wash:  #292335;
      --shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
      --shadow-up: 0 6px 0 rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --paper:      #14111C;
    --surface:    #1F1A2B;
    --surface-2:  #2A2438;
    --ink:        #F2ECE4;
    --ink-2:      #BDB4CC;
    --ink-3:      #8B82A0;
    --rule:       #362E48;
    --rule-soft:  #261F35;
    --accent:     #FF6E62;
    --accent-2:   #FFC24D;
    --accent-wash:#3B2029;
    --on-accent:  #1A0F10;
    --on-accent-2:#1A1725;

    --panel-bg:    #2A2438;
    --panel-fg:    #F2ECE4;
    --panel-accent:#FFC24D;
    --strong:     #47C79C;
    --strong-wash:#123328;
    --okay:       #E7AB4C;
    --okay-wash:  #33260F;
    --weak:       #948AA6;
    --weak-wash:  #292335;
    --shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
    --shadow-up: 0 6px 0 rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-ui);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
  p { margin: 0 0 0.85em; }
  p:last-child { margin-bottom: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 26px 100px; }

  .kicker {
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ---------- masthead ---------- */

  .top { padding: 56px 0 8px; text-align: center; }
  .top .flag {
    display: inline-block;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 6px 14px;
    transform: rotate(-1.4deg);
  }
  .top h1 {
    font-family: var(--f-display);
    font-size: clamp(2.8rem, 9vw, 5.6rem);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.92;
    margin: 20px 0 0;
  }
  .top h1 .zap { color: var(--accent); }
  .top .tag {
    margin: 20px auto 0;
    max-width: 46ch;
    font-size: 1.12rem;
    color: var(--ink-2);
  }

  /* ---------- menu ---------- */

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
    gap: 20px;
    margin-top: 46px;
  }
  .pick {
    position: relative;
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 24px 22px 26px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
  }
  .pick:hover { transform: translate(-2px, -4px); box-shadow: var(--shadow-up); }
  .pick:active { transform: translate(0, 0); box-shadow: var(--shadow); }
  .pick .num {
    position: absolute;
    top: -2px;
    right: -2px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--f-display);
    font-size: 15px;
    font-weight: 800;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
  }
  .pick .chip {
    align-self: flex-start;
    background: var(--accent-wash);
    color: var(--accent);
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 4px 9px;
  }
  .pick h3 {
    font-family: var(--f-display);
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.08;
    padding-right: 30px;
  }
  .pick p { font-size: 0.93rem; color: var(--ink-2); margin: 0; }
  .pick .done {
    margin-top: 2px;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--strong);
    font-weight: 500;
  }

  .how {
    margin-top: 40px;
    padding: 26px 30px 30px;
    background: var(--panel-bg);
    color: var(--panel-fg);
  }
  .how h4 {
    font-family: var(--f-display);
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--panel-accent);
  }
  .how-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 22px 24px;
    margin-top: 20px;
  }
  @media (min-width: 940px) {
    .how-steps { grid-template-columns: repeat(5, 1fr); }
  }
  .how-step { padding-top: 12px; border-top: 2px solid var(--panel-accent); }
  .how-step .n {
    display: block;
    font-family: var(--f-display);
    font-size: 1.5rem;
    font-weight: 800;
    line-height: 1;
    color: var(--panel-accent);
    font-variant-numeric: tabular-nums;
  }
  .how-step p { margin: 9px 0 0; font-size: 0.9rem; line-height: 1.45; opacity: 0.9; }
  .guidelink { margin: 22px 0 0; font-size: 0.92rem; opacity: 0.9; }
  .guidelink a { color: var(--panel-accent); text-underline-offset: 4px; }

  /* ---------- play chrome ---------- */

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 22px 0 16px;
  }
  .bar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .linkish {
    background: none;
    border: none;
    padding: 0;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .linkish:hover { color: var(--accent); }
  .backbtn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 8px 15px;
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: transform 0.13s ease, box-shadow 0.13s ease, background 0.13s ease;
  }
  .backbtn:hover { transform: translate(-2px, -3px); box-shadow: var(--shadow-up); background: var(--accent-wash); }
  .backbtn:active { transform: none; box-shadow: var(--shadow); }
  .backbtn .arw { font-size: 13px; line-height: 1; }
  .rounds { display: flex; gap: 5px; }
  .seg {
    width: 34px;
    height: 7px;
    background: var(--rule);
    border: 1px solid var(--ink);
  }
  .seg.done { background: var(--accent); }
  .seg.now { background: var(--accent-2); }

  .brief {
    padding: 22px 26px 24px;
    background: var(--panel-bg);
    color: var(--panel-fg);
    max-width: 78ch;
    border-left: 6px solid var(--panel-accent);
  }
  .brief .kicker { display: block; margin-bottom: 9px; color: var(--panel-accent); }
  .brief p { font-size: 1rem; opacity: 0.92; }

  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr);
    gap: 44px;
    margin-top: 34px;
    align-items: start;
  }

  .step-head { margin-bottom: 22px; }
  .step-head .job {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .step-head h2 {
    font-family: var(--f-display);
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    margin: 10px 0 0;
  }
  .step-head .prompt { margin-top: 13px; color: var(--ink-2); font-size: 0.98rem; max-width: 54ch; }

  /* ---------- tiles ---------- */

  .tiles { display: flex; flex-direction: column; gap: 13px; }
  .tile {
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 16px;
    align-items: start;
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 17px 20px;
    font-size: 0.98rem;
    line-height: 1.5;
    transition: transform 0.13s ease, box-shadow 0.13s ease, background 0.13s ease;
  }
  .tile:hover { transform: translate(-2px, -4px); box-shadow: var(--shadow-up); background: var(--accent-wash); }
  .tile:active { transform: translate(0, 0); box-shadow: var(--shadow); }
  .tile .key {
    font-family: var(--f-display);
    font-size: 1rem;
    font-weight: 800;
    background: var(--ink);
    color: var(--paper);
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
  }
  .tile:hover .key { background: var(--accent); }

  .hint {
    margin-top: 20px;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-3);
  }

  /* ---------- draft ---------- */

  .preview { position: sticky; top: 22px; }
  .draft { background: var(--surface); border: 2px solid var(--ink); box-shadow: var(--shadow); }
  .draft-top {
    padding: 11px 20px;
    background: var(--panel-bg);
    color: var(--panel-fg);
    font-family: var(--f-mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .draft-top span:last-child { color: var(--panel-accent); }
  .draft-meta {
    padding: 14px 20px;
    border-bottom: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: 11.5px;
    line-height: 1.85;
    color: var(--ink-3);
  }
  .draft-meta b { color: var(--ink); font-weight: 500; }
  .draft-meta .empty { opacity: 0.55; }
  .draft-body { padding: 18px 20px 22px; font-family: var(--f-mail); font-size: 0.95rem; line-height: 1.6; }
  .draft-body .line { margin-bottom: 0.85em; }
  .draft-body .line:last-child { margin-bottom: 0; }
  .draft-body .slot {
    border: 2px dashed var(--rule);
    padding: 10px 12px;
    color: var(--ink-3);
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .pop { animation: pop 0.32s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }

  /* ---------- reveal ---------- */

  .result { max-width: 800px; margin: 10px auto 0; }
  .bigscore { text-align: center; padding: 26px 0 6px; }
  .bigscore .n {
    font-family: var(--f-display);
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 800;
    letter-spacing: -0.06em;
    line-height: 0.85;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    display: block;
  }
  .bigscore .of {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .perfect {
    display: inline-block;
    margin-top: 16px;
    background: var(--accent-2);
    color: var(--on-accent-2);
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 7px 15px;
    transform: rotate(-1.5deg);
  }
  .result h2 {
    font-family: var(--f-display);
    font-size: clamp(1.7rem, 4.4vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    text-align: center;
    margin-top: 22px;
  }

  .reply {
    margin-top: 26px;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
  }
  .reply .rt {
    padding: 11px 20px;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .reply .rb { padding: 20px; font-family: var(--f-mail); font-size: 1rem; line-height: 1.6; }

  .full-mail { margin-top: 26px; background: var(--surface); border: 2px solid var(--ink); }

  .review { margin-top: 44px; }
  .review > h3 {
    font-family: var(--f-display);
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.035em;
  }
  .review > p { color: var(--ink-2); font-size: 0.95rem; margin: 6px 0 22px; }

  .row {
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 20px 22px 22px;
    margin-bottom: 16px;
  }
  .prin {
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px dashed var(--rule);
    padding: 3px 9px;
  }
  .row .rhead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .row .part {
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .badge {
    font-family: var(--f-mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 2px solid;
  }
  .badge.b0 { color: var(--weak); border-color: var(--weak); background: var(--weak-wash); }
  .badge.b1 { color: var(--okay); border-color: var(--okay); background: var(--okay-wash); }
  .badge.b2 { color: var(--strong); border-color: var(--strong); background: var(--strong-wash); }

  .row .yours {
    font-family: var(--f-mail);
    font-size: 0.98rem;
    line-height: 1.55;
    padding: 12px 16px;
    border-left: 5px solid var(--rule);
    background: var(--surface-2);
  }
  .row.g0 .yours { border-left-color: var(--weak); }
  .row.g1 .yours { border-left-color: var(--okay); }
  .row.g2 .yours { border-left-color: var(--strong); }
  .row .note { margin-top: 13px; font-size: 0.94rem; color: var(--ink-2); }
  .row .best {
    margin-top: 15px;
    padding: 14px 16px;
    background: var(--strong-wash);
    border: 2px dashed var(--strong);
  }
  .row .best b {
    display: block;
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--strong);
    margin-bottom: 7px;
  }
  .row .best span { font-family: var(--f-mail); font-size: 0.95rem; line-height: 1.5; }

  .rise { animation: rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 38px; }
  .go {
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 13px 26px;
    font-family: var(--f-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: transform 0.13s ease, box-shadow 0.13s ease;
  }
  .go:hover { transform: translate(-2px, -4px); box-shadow: var(--shadow-up); }
  .go:active { transform: none; box-shadow: var(--shadow); }
  .go.ghost { background: var(--surface); color: var(--ink); }

  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; gap: 30px; }
    .preview { position: static; }
  }
  @media (max-width: 600px) {
    body { font-size: 16px; }
    .wrap { padding: 0 18px 70px; }
    .top { padding: 36px 0 4px; }
    .tile { grid-template-columns: 32px 1fr; gap: 12px; padding: 15px 16px; }
    .tile .key { width: 26px; height: 26px; font-size: 0.85rem; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, .pop, .rise { animation: none !important; transition: none !important; }
  }

<div class="wrap">
  <div id="app"></div>
</div>

<script>
const SCENARIOS = [
  {
    id: "assessment",
    name: "The missing assessment",
    tone: "Warm",
    blurb: "A good student has gone quiet a week after a deadline.",
    student: "Sarah Mitchell",
    brief: "Sarah is a full-time nurse, four weeks into her first term. She was active every week until Week 3, then stopped. Her Week 4 assessment was due eight days ago and nothing has come through. Nobody has contacted her about it yet.",
    steps: [
      {
        part: "Subject line",
        job: "Make the promise",
        prompt: "Sarah will see this in a list of forty other emails on her phone. Pick the subject line.",
        tiles: [
          { tier: 0, principle: "Negativity bias", text: "Reminder regarding outstanding assessment submission", why: "Two words, both of them about her failure. Short is not the problem here, cold is. With no warmth attached and nothing about what happens next, the only information she gets is that she is in trouble, and the person most likely to avoid opening it is the person who most needs to." },
          { tier: 1, principle: "Processing fluency", text: "Week 4 assessment: action required", why: "Specific, which is a real improvement, and she can see what it concerns. But action required is the language of a debt collector rather than a person, and it puts her on the back foot before she has opened anything." },
          { tier: 2, principle: "Negativity bias", text: "Getting your Week 4 assessment sorted", why: "Names the exact thing and frames it as help rather than a chase. Sorted is doing the emotional work: it tells her this is fixable and that someone is on her side, and she gets both of those before she opens anything." }
        ]
      },
      {
        part: "First line",
        job: "Get to the point",
        prompt: "If she reads one line and closes the email, this is the line. Pick it.",
        tiles: [
          { tier: 0, principle: "Processing fluency", text: "I hope this email finds you well and that your studies are progressing satisfactorily. I am writing to follow up on my previous correspondence of 8 August regarding your ongoing progress in the course and to request an update at your convenience.", why: "Two sentences that carry no information. By the time she reaches anything actionable she has already filed this as a form letter, and form letters can wait. Long is not the fault in itself. Long while saying nothing is." },
          { tier: 1, principle: "Processing fluency", text: "I am writing about your Week 4 assessment, which was due on 8 August.", why: "Gets there, and she knows the topic straight away. But it is a bare statement of fact with no direction attached, so she still does not know whether the rest of this email is help or trouble, and she will assume trouble." },
          { tier: 2, principle: "Negativity bias", text: "Your Week 4 assessment hasn't come through. I wanted to write myself rather than let the system chase you, because I'd like to help you get it in.", why: "The problem, the fact that a person chose to write this, and your intent, all in the opening. That middle clause costs you a line and buys you a lot, because it separates you from the automated reminders she has been ignoring." }
        ]
      },
      {
        part: "The middle",
        job: "Only what she needs",
        prompt: "You have about two sentences before she stops reading. Pick what goes in them.",
        tiles: [
          { tier: 0, principle: "Self-efficacy", text: "This is now eight days overdue and non-submission affects your progression.", why: "Brief, accurate, and it lands like a slap. Leading with the consequence triggers avoidance in exactly the student who most needs to reply, and there is nothing here to soften it. Being short did not make this efficient, it made it colder." },
          { tier: 1, principle: "Processing fluency", text: "The assessment was due on 8 August and is now a week overdue. Late submissions can still be marked.", why: "Accurate, and the second sentence does real work by telling her the door is not shut. But it is all administration, and it does nothing about the reason she has actually gone quiet." },
          { tier: 2, principle: "Self-efficacy", text: "Week 4 is where a lot of people hit a wall, especially on shift work. You're in better company than it feels like, and it's fixable.", why: "The single highest leverage passage in the email, and it is the longest of the three on purpose. What is stopping her is not the deadline, it is the belief that she is uniquely behind. Telling her that this is normal and survivable is the thing that makes replying possible." }
        ]
      },
      {
        part: "The ask",
        job: "One thing, clearly",
        prompt: "This is what you actually want her to do. Pick it.",
        tiles: [
          { tier: 0, principle: "Decision friction", text: "Please advise as to your intentions in respect of the outstanding assessment at your earliest convenience. Additionally, please ensure that your contact details are up to date in the student portal, and note that you may also wish to review the late submission guidance available in the handbook.", why: "Two asks, neither with a date, and advise your intentions demands a decision she is not ready to make. You will get the easy one, or nothing at all, and then you will send a second email chasing the rest." },
          { tier: 1, principle: "Self-efficacy", text: "Can you let me know when you'll be able to submit?", why: "One ask, which is right, and it is perfectly polite. But it demands a commitment. A student who has not started cannot answer honestly without confessing how far behind she is, so the safest thing she can do is nothing." },
          { tier: 2, principle: "Self-efficacy", text: "Could you reply with one line telling me where you're up to? Anything is useful, including \"haven't started\". No answer here gets you into trouble.", why: "It hands her a way to answer badly and then says out loud that answering badly is safe. That last clause is not padding. It is the sentence that removes the fear, and the fear is the only thing actually stopping her from replying." }
        ]
      },
      {
        part: "The close",
        job: "Leave the door open",
        prompt: "Last thing she reads, and what she carries into whether she answers. Pick it.",
        tiles: [
          { tier: 0, principle: "Self-determination", text: "Failure to respond may result in further action being taken.", why: "You spent an entire email building safety and removed it in eleven words. This is the sentence she will remember, and it converts a person who wanted to help her into a process that is coming for her." },
          { tier: 1, principle: "Negativity bias", text: "Let me know if you need anything.", why: "Harmless and better than a threat, but it is doing no work at all. Anything is too vague to act on, and it quietly hands the effort back to her at the exact point you should be taking it off her." },
          { tier: 2, principle: "Self-determination", text: "No need to write anything long, and no need to explain yourself. I'll take it from there and we'll work around your shifts.", why: "Shrinks the reply, removes the obligation to justify herself, promises to carry the load, and shows you know she works nights. Four separate reassurances, and it is the longest close of the three because warmth takes words." }
        ]
      }
    ],
    outcomes: {
      strong: {
        verdict: "She replies in forty minutes.",
        reply: "Hi, thanks for this. Honestly I haven't started it. I picked up extra shifts in August and I've been drowning. I thought I'd already blown it and there was no point in saying anything. Tell me what I need to do and I'll do it."
      },
      mixed: {
        verdict: "She replies four days later.",
        reply: "Sorry for the slow reply. I've been meaning to get to this. I'll try to get the assessment done this week."
      },
      weak: {
        verdict: "No reply. You chase again next week.",
        reply: "Nothing comes back. She opens the email on the Tuesday and does not open the next one at all."
      }
    }
  },

  {
    id: "extension",
    name: "The extension you can't give",
    tone: "Firm but kind",
    blurb: "Saying no without losing the student.",
    student: "Daniel Okafor",
    brief: "Daniel has emailed asking for a two week extension on his final assessment. The deadline passed three days ago. Policy is clear: extensions have to be requested before the due date, so you cannot backdate one. He can still submit late at 5 per cent a day, and he is currently sitting on a credit average.",
    steps: [
      {
        part: "Subject line",
        job: "Make the promise",
        prompt: "He is expecting bad news. Pick the subject line.",
        tiles: [
          { tier: 0, principle: "Negativity bias", text: "RE: Extension request", why: "A reply header rather than a subject line. It tells him nothing about the answer, so he opens it braced for a refusal and reads every sentence after that defensively." },
          { tier: 1, principle: "Processing fluency", text: "Your extension request", why: "Clear enough, and at least it is about him rather than about policy. It still frames the entire email around the thing you are refusing, which is the least useful half of what you have to say." },
          { tier: 2, principle: "Negativity bias", text: "Your extension request, and what we can do instead", why: "Signals the no and the way forward in the same line, so he opens it looking for the option rather than bracing for the refusal. Longer than the other two, and the extra words are the ones doing the work." }
        ]
      },
      {
        part: "First line",
        job: "Get to the point",
        prompt: "Pick the opening.",
        tiles: [
          { tier: 0, principle: "Negativity bias", text: "Unfortunately your request has been declined.", why: "Six words, no person in them, and the passive voice makes it sound like a machine decided. Short and clear is not the same as short and kind, and this is a good example of the difference." },
          { tier: 1, principle: "Processing fluency", text: "Thank you for your email. Unfortunately, I regret to inform you that we are unable to approve your request.", why: "Three units of padding wrapped around a no. The softening does not actually soften anything, it just delays the news and makes the refusal sound more official than it needs to." },
          { tier: 2, principle: "Self-efficacy", text: "I can't backdate an extension, and I'm sorry, because I can see why you're asking. You can still submit and still pass. Here's how.", why: "Answers the refusal, acknowledges that the request was reasonable, and answers the question underneath every extension request, which is am I finished. Warmth and speed in the same breath, which is what the curt version cannot do." }
        ]
      },
      {
        part: "The middle",
        job: "Only what he needs",
        prompt: "Pick how you explain it.",
        tiles: [
          { tier: 0, principle: "Self-determination", text: "As per the Assessment Policy section 4.2, extension requests must be submitted prior to the assessment due date and must be accompanied by supporting documentation where applicable. As your request was received after the due date had passed, it does not meet the criteria for approval and no discretion is available to me in these circumstances.", why: "Hiding behind a policy number. It reads as though a system said no rather than a person, which leaves him nobody to talk to and nothing to work with. The length is not the problem, the absence of a human being is." },
          { tier: 1, principle: "Processing fluency", text: "Extensions have to be requested before the due date, so I can't approve this one.", why: "Plain and human, and a big improvement on the policy citation. But it is still only the no, and it leaves the genuinely useful half of the message unsaid." },
          { tier: 2, principle: "Decision friction", text: "Extensions have to be in before the due date, so this one sits outside what I can approve. What I can do is flag it for late marking, which costs 5 per cent a day rather than a zero.", why: "The no, the reason, an acknowledgement that the reason will not make him feel better, and a concrete alternative with a real number on it. He can now make a decision instead of sitting with the worry." }
        ]
      },
      {
        part: "The ask",
        job: "One thing, clearly",
        prompt: "Pick the ask.",
        tiles: [
          { tier: 0, principle: "Decision friction", text: "Please advise how you wish to proceed.", why: "Hands him a decision with no information attached. He now has to do the arithmetic himself, and while he works out whether it is worth it the penalty keeps climbing." },
          { tier: 1, principle: "Decision friction", text: "Let me know if you'd like to go ahead with that.", why: "One clear ask, and reasonable. But there is no date on it, and with 5 per cent a day running, a vague timeline is actively costing him marks while he thinks about it." },
          { tier: 2, principle: "Decision friction", text: "Get it in by Friday and you'll lose 10 per cent and still pass comfortably. Want me to set that up?", why: "Does the maths for him, names the date, reassures him about where he stands, and reduces the decision to yes or no. He can answer this in four seconds from a phone." }
        ]
      },
      {
        part: "The close",
        job: "Leave the door open",
        prompt: "Pick the close.",
        tiles: [
          { tier: 0, principle: "Self-determination", text: "Please note that any further late submissions will not be considered, and that repeated failure to meet assessment deadlines may be referred for review under the academic progress procedure. You may wish to familiarise yourself with the relevant sections of the handbook before your next submission.", why: "A warning shot after a refusal. He came to you with a problem and leaves feeling like a risk being managed, and this is the line that stops him asking for help the next time he needs it." },
          { tier: 1, principle: "Negativity bias", text: "Let me know if you have any questions.", why: "Neutral and safe, and it does not acknowledge that he is almost certainly stressed. The email ends colder than you meant it to, because you left the warmth out and text does not supply its own." },
          { tier: 2, principle: "Self-determination", text: "I know this isn't the answer you wanted, and asking was still the right thing to do. I'd much rather get you across the line than watch you walk away over three days.", why: "Names the disappointment instead of stepping around it, tells him he was not wrong to ask, and says whose side you are on. You refused him and he still finishes the email trusting you, which is the entire job." }
        ]
      }
    ],
    outcomes: {
      strong: {
        verdict: "He replies in ten minutes and submits on Thursday.",
        reply: "Yes please, set it up. Thanks for being straight with me and for not making me feel like an idiot for asking. I thought I'd lost the whole subject. I'll have it in by Thursday."
      },
      mixed: {
        verdict: "He replies the next day, one more question first.",
        reply: "OK. So if I submit now how much do I actually lose? And does this go on my record anywhere?"
      },
      weak: {
        verdict: "He escalates.",
        reply: "This is really disappointing. I explained my circumstances and got a policy number back. Can you please pass this to your manager."
      }
    }
  },

  {
    id: "complaint",
    name: "The complaint you deserve",
    tone: "Repair",
    blurb: "She is angry, and she is right.",
    student: "Priya Raman",
    brief: "Priya has emailed, clearly furious. She was charged for a subject she withdrew from, and says nobody has replied to her in two weeks. You check. She is right on both counts. Her withdrawal went in on 3 August, well before census, and two of her emails were missed at your end.",
    steps: [
      {
        part: "Subject line",
        job: "Make the promise",
        prompt: "She is expecting another brush-off. Pick the subject line.",
        tiles: [
          { tier: 0, principle: "Processing fluency", text: "RE: RE: RE: Enquiry", why: "The subject line is itself evidence of the problem. Three replies deep and still labelled enquiry, which tells her she is a ticket in a queue and that nobody has actually read what she wrote." },
          { tier: 1, principle: "Processing fluency", text: "Your withdrawal and the charge", why: "Clear and specific, and she can see you know which issue this is. It gives her no signal at all about whether anything is being fixed, so she opens it expecting to have to fight." },
          { tier: 2, principle: "Negativity bias", text: "Sorting your refund, and an apology", why: "Leads with the fix and owns the failure before she opens anything. Half her anger is about being ignored, and the word apology in the subject line answers that immediately." }
        ]
      },
      {
        part: "First line",
        job: "Get to the point",
        prompt: "Pick the opening.",
        tiles: [
          { tier: 0, principle: "Negativity bias", text: "Thank you for your email and for bringing this matter to our attention. We sincerely apologise for any inconvenience that may have been caused and we appreciate your patience while your enquiry was being processed through our standard channels.", why: "The corporate non-apology. Any inconvenience refuses to name what actually happened, and thanking her for patience she did not have and was not offered will read as sarcasm to someone already angry." },
          { tier: 1, principle: "Negativity bias", text: "I'm sorry for the delay in getting back to you. I've looked into the charge.", why: "A real apology and evidence that you did something, which is genuinely better. But it apologises only for the delay and stays carefully quiet about the charge being your error, and she will notice the gap." },
          { tier: 2, principle: "Negativity bias", text: "You're right, and I'm sorry. Two weeks with no reply isn't good enough and the charge shouldn't have happened. Neither was your fault.", why: "Concedes every point in the opening, unprompted and without hedging, and explicitly takes the chasing off her. Nothing de-escalates an angry person faster than being agreed with before they have had to make their case." }
        ]
      },
      {
        part: "The middle",
        job: "Only what she needs",
        prompt: "Pick what you tell her.",
        tiles: [
          { tier: 0, principle: "Self-determination", text: "Withdrawals must be submitted through the portal.", why: "Seven words explaining the process to the person your process failed. It is short, it is technically true, and it reads as laying the groundwork to blame her. This is the exact register that turns a complaint into an escalation." },
          { tier: 1, principle: "Processing fluency", text: "I've checked and your withdrawal was submitted on time. The charge was an error at our end.", why: "Clear, and it takes the blame properly rather than hiding behind the passive voice. It is only missing the specifics that turn a claim into proof." },
          { tier: 2, principle: "Processing fluency", text: "Your withdrawal went in on 3 August, well inside census. The charge is our error, not yours. You did everything right and we billed you anyway.", why: "The date, the reason, and an explicit statement that she did nothing wrong. Naming the specific evidence proves you opened the file rather than writing a soothing sentence, and that is what makes the apology credible." }
        ]
      },
      {
        part: "The ask",
        job: "One thing, clearly",
        prompt: "Pick the ask.",
        tiles: [
          { tier: 0, principle: "Decision friction", text: "Please complete the attached refund request form in full and return it to this address so that we can begin processing your request. Please note that refund requests are subject to verification and that processing times of up to ten business days may apply once the completed form is received.", why: "You made the mistake and the homework goes to her. Handing paperwork to someone you have already let down twice is the fastest route from a complaint to an escalation." },
          { tier: 1, principle: "Decision friction", text: "Can you confirm the account details you'd like the refund to go to?", why: "One clear ask, and reasonable. It still leaves her carrying a step, and she has no idea whether anything has actually started moving yet, which is precisely what she is angry about." },
          { tier: 2, principle: "Decision friction", text: "I've started the reversal already, so there's nothing for you to do or fill in. I just need a yes: is the card ending 4471 still right?", why: "Action already taken, paperwork explicitly ruled out, and the effort reduced to a single word. The card digits also prove you have her record open in front of you, which does more for her trust than another apology would." }
        ]
      },
      {
        part: "The close",
        job: "Leave the door open",
        prompt: "Pick the close.",
        tiles: [
          { tier: 0, principle: "Negativity bias", text: "We value your feedback as it helps us to improve our services, and we thank you once again for your patience throughout this process. Should you have any further concerns please do not hesitate to contact us through the usual channels.", why: "Back to the corporate voice at the exact moment she needs a person. It undoes whatever the rest of the email earned, because it proves there was a script running underneath it all along." },
          { tier: 1, principle: "Self-determination", text: "Sorry again, and let me know if anything else comes up.", why: "Human and perfectly fine. It just ends passively, leaving her to chase you if nothing happens, and being left to chase is the thing she wrote in about." },
          { tier: 2, principle: "Self-determination", text: "I'll email you the moment it clears so you never have to chase me again. My direct number is below if you'd rather talk.", why: "You take on the chasing yourself and offer a channel where she can actually be heard. Offering the phone to an angry person almost always means they never need to use it, because what they wanted was to be taken seriously." }
        ]
      }
    ],
    outcomes: {
      strong: {
        verdict: "She replies within the hour, and the complaint stops here.",
        reply: "Thank you. That's the first response I've had that actually addressed it. Card ending 4471 is correct. I appreciate you being straight about it, I'd more or less given up and was about to go to the university."
      },
      mixed: {
        verdict: "She replies, still wary.",
        reply: "OK, thanks. Account details are the same card. Can you confirm how long this will take, because I've been told things would happen before and they didn't."
      },
      weak: {
        verdict: "She escalates, and this time she copies in the university.",
        reply: "This is the third time I've been sent a form instead of an answer. I am copying in the university partner and the Ombudsman. I want this in writing from someone senior."
      }
    }
  },
  {
    id: "silent",
    name: "The student who's gone quiet",
    tone: "Last chance",
    blurb: "Third contact, and the clock is running out.",
    student: "Marcus Whelan",
    brief: "Marcus has not logged in for three weeks. No submissions, and no reply to your two previous emails. If nothing changes, his enrolment is automatically withdrawn on 12 September, which is ten days away. This is your last contact before that happens.",
    steps: [
      {
        part: "Subject line",
        job: "Make the promise",
        prompt: "Two of your emails are already sitting unopened. Pick the subject line.",
        tiles: [
          { tier: 0, principle: "Self-determination", text: "Third and final notice", why: "The language of a utility company about to cut someone off. Four words, and every one of them tells him he is in trouble. Someone already avoiding you reads that in the preview pane and never opens it, which guarantees the outcome you are trying to prevent." },
          { tier: 1, principle: "Processing fluency", text: "Your enrolment: important", why: "Honest, and it signals weight without threatening him. But important is what every automated email in his inbox claims to be, and it still reads institutional rather than like a person who noticed he was missing." },
          { tier: 2, principle: "Negativity bias", text: "Are you still with us, Marcus?", why: "A real question from a real person, using his name. It does not accuse him of anything, and after two ignored warnings a question he can answer beats a third warning he cannot face." }
        ]
      },
      {
        part: "First line",
        job: "Get to the point",
        prompt: "Pick the opening.",
        tiles: [
          { tier: 0, principle: "Negativity bias", text: "This is my third attempt to contact you regarding your continued lack of engagement with the course. As you will be aware from my previous emails, students are expected to maintain regular participation, and I have so far received no response to any of my communications.", why: "Your frustration, front and centre. Third attempt and lack of engagement both tell him he has done something wrong, and he will feel the irritation and stop reading well before the part that could actually help him." },
          { tier: 1, principle: "Negativity bias", text: "I haven't heard from you in a few weeks and wanted to check in before anything changes on your enrolment.", why: "Warm, and it flags the stakes without threatening. Genuinely good. Check in is slightly soft for a situation with ten days left on the clock, but nothing here does any harm." },
          { tier: 2, principle: "Negativity bias", text: "I haven't heard from you in a while, and I'd rather ask than assume. Usually something has got in the way. It's rarely that someone stopped caring.", why: "Explicitly refuses to assume the worst, then says out loud what he is most afraid you think. After three weeks of silence he is expecting judgement, and being handed the opposite is what makes a reply possible." }
        ]
      },
      {
        part: "The middle",
        job: "Only what he needs",
        prompt: "Pick how you handle the deadline.",
        tiles: [
          { tier: 0, principle: "Negativity bias", text: "As previously advised, continued non-engagement will result in withdrawal.", why: "As previously advised is frustration leaking out through formality, and he will hear the irritation and take in none of the content, including the deadline that actually matters to him. Nine words, and it costs you the whole email." },
          { tier: 1, principle: "Processing fluency", text: "If we don't hear anything by 12 September your enrolment will be withdrawn.", why: "Clear, dated, and there is no threat in the wording, which is a genuine improvement. It just states what the machine will do without telling him he has any power over it." },
          { tier: 2, principle: "Self-determination", text: "Honestly: if I don't hear from you by 12 September the system withdraws you automatically. I can put a hold on that the moment you say you want to stay.", why: "Same deadline, but it separates the automatic process from you and puts the handbrake in his hands. He is not being punished by a person, he is being offered control by one, and control is what gets a reply out of someone who has been avoiding you." }
        ]
      },
      {
        part: "The ask",
        job: "One thing, clearly",
        prompt: "Pick the ask.",
        tiles: [
          { tier: 0, principle: "Self-determination", text: "You are required to respond to this email as a matter of urgency.", why: "Pure pressure with no instruction attached. He does not know what a response is supposed to contain, and being ordered to reply is the fastest way to make someone already avoiding you avoid you harder." },
          { tier: 1, principle: "Self-efficacy", text: "Please let me know whether you intend to continue.", why: "One clear ask and perfectly polite. But intend to continue asks him to commit to the entire degree, and if he genuinely does not know the answer yet, the safest available move is to say nothing at all." },
          { tier: 2, principle: "Self-efficacy", text: "Reply with one word if that's easier: continuing, or stopping. Both are fine, neither needs explaining, and if you're somewhere in between just say so.", why: "The smallest possible ask, explicit permission to give the answer you do not want, no obligation to justify it, and a third door for the honest answer of I do not know. Longer than the other two, and every extra clause removes another reason to stay silent." }
        ]
      },
      {
        part: "The close",
        job: "Leave the door open",
        prompt: "Pick the close.",
        tiles: [
          { tier: 0, principle: "Self-determination", text: "Failure to respond by the date specified will be taken as confirmation that you no longer wish to continue with your studies, and your enrolment will be withdrawn accordingly without further notice. Any outstanding fees incurred to that date will remain payable.", why: "It punishes silence, and silence is his symptom rather than his decision. Worse, it quietly makes not replying a valid way to choose, which is precisely the outcome you were trying to prevent." },
          { tier: 1, principle: "Negativity bias", text: "I hope to hear from you soon.", why: "Warm and inoffensive, and doing nothing whatsoever. With ten days left you cannot afford a closing line that neither reassures him nor moves him." },
          { tier: 2, principle: "Self-efficacy", text: "If life has got in the way that's genuinely OK, and it happens to plenty of people who go on to finish. There are options either way. I just can't use any of them until I hear from you.", why: "Removes the shame, tells him people in his position do recover, and then makes his reply the thing that unlocks help rather than the thing that gets him told off. It gives silence a cost without ever making it a threat." }
        ]
      }
    ],
    outcomes: {
      strong: {
        verdict: "He replies that night.",
        reply: "Continuing. Sorry for going quiet. My dad went into hospital in August and I just stopped opening anything. I didn't know how to explain it so I didn't explain it. If there are options I'd like to hear them."
      },
      mixed: {
        verdict: "He replies on day nine, with one day to spare.",
        reply: "Sorry, only just seen this. Yes I want to keep going. What do I need to do?"
      },
      weak: {
        verdict: "Nothing comes back. The withdrawal runs on 12 September.",
        reply: "No reply. Six weeks later he calls the enquiries line asking how to re-enrol, and finds out he owes for a subject he never completed."
      }
    }
  },

  {
    id: "fridge",
    name: "The office fridge",
    tone: "All staff",

const GRADES = ["Weak", "Okay", "Strong"];
const KEYS = ["A", "B", "C"];
const app = document.getElementById("app");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = {
  screen: "menu",
  scenario: null,
  step: 0,
  picks: [],
  orders: [],
  justPicked: false,
  best: {}
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function shuffled(n) {
  const a = [...Array(n).keys()];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function total() {
  return state.picks.reduce((s, p) => s + p.tier, 0);
}

function orderFor(step) {
  if (!state.orders[step]) state.orders[step] = shuffled(3);
  return state.orders[step];
}

function goBack() {
  if (state.step === 0) return;
  state.step -= 1;
  state.picks.length = state.step;
  state.justPicked = false;
  render();
}

function band(score) {
  if (score >= 8) return "strong";
  if (score >= 5) return "mixed";
  return "weak";
}

function renderMenu() {
  const cards = SCENARIOS.map((s, i) => `
    <button class="pick" data-go="${i}">
      <span class="num">${i + 1}</span>

      <h3>${esc(s.name)}</h3>
      <p>${esc(s.blurb)}</p>
      ${state.best[s.id] !== undefined ? `<span class="done">Best so far: ${state.best[s.id]} out of 10</span>` : ""}
    </button>`).join("");

  app.innerHTML = `
    <div class="top">
      <span class="flag">Advisor email training</span>
      <h1>Who Wrote It <span class="zap">Better</span></h1>
      <p class="tag">A situation lands in your inbox. Build the reply one line at a time. No hints, no scores, no idea how you are doing until you hit send.</p>

        </div>

        </div>

        </div>
      </div>

}

function startScenario(i) {
  state.scenario = SCENARIOS[i];
  state.step = 0;
  state.picks = [];
  state.justPicked = false;
  state.orders = [];
  state.screen = "play";
  render();
}

function draftHtml() {
  const sc = state.scenario;
  const subject = state.picks[0]
    ? `<b>${esc(state.picks[0].text)}</b>`
    : `<span class="empty">not written yet</span>`;

  const lines = [];
  if (state.picks.length > 0) {
    lines.push(`<div class="line">Hi ${esc(sc.student.split(" ")[0])},</div>`);
  }
  for (let i = 1; i < 5; i++) {
    if (state.picks[i]) {
      const fresh = state.justPicked && i === state.step - 1 && !reduceMotion;
      lines.push(`<div class="line${fresh ? " pop" : ""}">${esc(state.picks[i].text)}</div>`);
    } else if (i === state.step) {
      lines.push(`<div class="line slot">${esc(sc.steps[i].part)} goes here</div>`);
    }
  }
  if (lines.length === 0) {
    lines.push(`<div class="line slot">Nothing written yet</div>`);
  }

  return `
    <div class="preview">
      <div class="draft">
        <div class="draft-top"><span>Your draft</span><span>Round ${state.step + 1} of 5</span></div>
        <div class="draft-meta">
          <div>To: <b>${esc(sc.student)}</b></div>
          <div>Subject: ${subject}</div>
        </div>
        <div class="draft-body">${lines.join("")}</div>
      </div>
    </div>`;
}

function renderPlay() {
  const sc = state.scenario;
  const st = sc.steps[state.step];

  const segs = sc.steps.map((_, i) => {
    const cls = i < state.step ? "seg done" : i === state.step ? "seg now" : "seg";
    return `<span class="${cls}"></span>`;
  }).join("");

  const tiles = orderFor(state.step).map((idx, pos) => {
    const t = st.tiles[idx];
    return `<button class="tile" data-tile="${idx}">
      <span class="key">${KEYS[pos]}</span>
      <span>${esc(t.text)}</span>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="bar">
      <div class="bar-left">
        <button class="backbtn" id="quit"><span class="arw">&#8592;</span> All situations</button>
        ${state.step > 0 ? `<button class="backbtn" id="back"><span class="arw">&#8592;</span> Back a round</button>` : ""}
        <span class="kicker">${esc(sc.name)}</span>
      </div>
      <div class="rounds">${segs}</div>
    </div>

    <div class="brief">
      <span class="kicker">The situation</span>
      <p>${esc(sc.brief)}</p>
    </div>

    <div class="stage">
      <div>
        <div class="step-head">
          <div class="job">Round ${state.step + 1} of 5 &middot; ${esc(st.job)}</div>
          <h2>${esc(st.part)}</h2>
          <p class="prompt">${esc(st.prompt)}</p>
        </div>
        <div class="tiles">${tiles}</div>
        <div class="hint">Press A, B or C to choose</div>
      </div>
      ${draftHtml()}
    </div>`;

  app.querySelector("#quit").addEventListener("click", () => { state.screen = "menu"; render(); });
  const backBtn = app.querySelector("#back");
  if (backBtn) backBtn.addEventListener("click", goBack);
  app.querySelectorAll("[data-tile]").forEach(b => {
    b.addEventListener("click", () => choose(Number(b.dataset.tile)));
  });
}

function choose(idx) {
  const t = state.scenario.steps[state.step].tiles[idx];
  state.picks[state.step] = { index: idx, tier: t.tier, text: t.text, why: t.why, principle: t.principle };

  if (state.step === 4) {
    const id = state.scenario.id;
    const s = total();
    if (state.best[id] === undefined || s > state.best[id]) state.best[id] = s;
    state.screen = "result";
    state.justPicked = false;
  } else {
    state.step += 1;
    state.justPicked = true;
      
  }
  render();
}

function countUp(el, target) {
  if (reduceMotion || target === 0) { el.textContent = target; return; }
  const dur = 700;
  const start = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function renderResult() {
  const sc = state.scenario;
  const score = total();
  const out = sc.outcomes[band(score)];

  const rows = sc.steps.map((st, i) => {
    const p = state.picks[i];
    const bestTile = st.tiles.find(t => t.tier === 2);
    const showBest = p.tier < 2;
    const delay = reduceMotion ? "" : ` style="animation-delay:${0.5 + i * 0.09}s"`;
    return `
      <div class="row g${p.tier} rise"${delay}>
        <div class="rhead">
          <span class="part">${esc(st.part)}</span>
          <span class="badge b${p.tier}">${GRADES[p.tier]} &middot; ${p.tier} ${p.tier === 1 ? "pt" : "pts"}</span>
          <span class="prin">${esc(p.principle)}</span>
        </div>
        <div class="yours">${esc(p.text)}</div>
        <div class="note">${esc(p.why)}</div>
        ${showBest ? `<div class="best"><b>The strongest option was</b><span>${esc(bestTile.text)}</span></div>` : ""}
      </div>`;
  }).join("");

  const emailLines = state.picks.slice(1).map(p => `<div class="line">${esc(p.text)}</div>`).join("");
  const d = n => reduceMotion ? "" : ` style="animation-delay:${n}s"`;

  app.innerHTML = `
    <div class="bar">
      <div class="bar-left">
        <button class="backbtn" id="quit"><span class="arw">&#8592;</span> All situations</button>
        <span class="kicker">${esc(sc.name)} &middot; the reveal</span>
      </div>
    </div>

    <div class="result">
      <div class="bigscore rise">
        <span class="n" id="tally">0</span>
        <span class="of">out of 10</span>
        ${score === 10 ? `<div class="perfect">Perfect email</div>` : ""}
      </div>

      <h2 class="rise"${d(0.2)}>${esc(out.verdict)}</h2>

      <div class="reply rise"${d(0.3)}>
        <div class="rt">What happened next</div>
        <div class="rb">${esc(out.reply)}</div>
      </div>

      <div class="full-mail rise"${d(0.4)}>
        <div class="draft-top"><span>What you sent</span><span>${score} of 10</span></div>
        <div class="draft-meta">
          <div>To: <b>${esc(sc.student)}</b></div>
          <div>Subject: <b>${esc(state.picks[0].text)}</b></div>
        </div>
        <div class="draft-body">
          <div class="line">Hi ${esc(sc.student.split(" ")[0])},</div>
          ${emailLines}
        </div>
      </div>

      <div class="review">
        <h3 class="rise"${d(0.45)}>Line by line</h3>
        <p class="rise"${d(0.48)}>What each choice was doing, and the strongest version of anything you missed.</p>
        ${rows}
      </div>

      <div class="actions">
        <button class="go" id="again">Play this one again</button>
        <button class="go ghost" id="quit2">Pick another situation</button>
      </div>
    </div>`;

  countUp(app.querySelector("#tally"), score);
  app.querySelector("#again").addEventListener("click", () => startScenario(SCENARIOS.indexOf(sc)));
  app.querySelector("#quit").addEventListener("click", () => { state.screen = "menu"; render(); });
  const backBtn = app.querySelector("#back");
  if (backBtn) backBtn.addEventListener("click", goBack);
  app.querySelector("#quit2").addEventListener("click", () => { state.screen = "menu"; render(); });
}

document.addEventListener("keydown", e => {
  if (state.screen !== "play") return;
  const k = e.key.toUpperCase();
  let pos = KEYS.indexOf(k);
  if (pos === -1 && "123".includes(k)) pos = Number(k) - 1;
  if (pos === -1) return;
  e.preventDefault();
  choose(orderFor(state.step)[pos]);
});

function render() {
  if (state.screen === "menu") renderMenu();
  else if (state.screen === "play") renderPlay();
  else renderResult();
  window.scrollTo({ top: 0, behavior: "instant" });
}

render();
</script>

</body>
</html>
