<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A training game for advisors. Build an email to a student one line at a time, then see everything revealed at the end.">
<title>Build the Email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
  :root {
    --paper:      #F7F1E8;
    --surface:    #FFFFFF;
    --surface-2:  #EFE6D8;
    --ink:        #1A1725;
    --ink-2:      #4F4860;
    --ink-3:      #857D94;
    --rule:       #DED3C4;
    --rule-soft:  #EBE2D5;

    --accent:     #DC4A40;
    --accent-2:   #E8A317;
    --accent-wash:#FBE3DF;
    --on-accent:  #FFFFFF;
    --on-accent-2:#1A1725;

    --panel-bg:    #1A1725;
    --panel-fg:    #F7F1E8;
    --panel-accent:#F2B138;

    --strong:     #147F63;
    --strong-wash:#DDF0E8;
    --okay:       #B87A12;
    --okay-wash:  #FAEBD1;
    --weak:       #8B819C;
    --weak-wash:  #ECE7F0;

    --shadow: 0 2px 0 rgba(26, 23, 37, 0.10);
    --shadow-up: 0 6px 0 rgba(26, 23, 37, 0.13);

    --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --f-ui: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --f-mail: "Source Serif 4", Georgia, "Times New Roman", serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #14111C;
      --surface:    #1F1A2B;
      --surface-2:  #2A2438;
      --ink:        #F2ECE4;
      --ink-2:      #BDB4CC;
      --ink-3:      #8B82A0;
      --rule:       #362E48;
      --rule-soft:  #261F35;
      --accent:     #FF6E62;
      --accent-2:   #FFC24D;
      --accent-wash:#3B2029;
      --on-accent:  #1A0F10;
      --on-accent-2:#1A1725;

      --panel-bg:    #2A2438;
      --panel-fg:    #F2ECE4;
      --panel-accent:#FFC24D;
      --strong:     #47C79C;
      --strong-wash:#123328;
      --okay:       #E7AB4C;
      --okay-wash:  #33260F;
      --weak:       #948AA6;
      --weak-wash:  #292335;
      --shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
      --shadow-up: 0 6px 0 rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --paper:      #14111C;
    --surface:    #1F1A2B;
    --surface-2:  #2A2438;
    --ink:        #F2ECE4;
    --ink-2:      #BDB4CC;
    --ink-3:      #8B82A0;
    --rule:       #362E48;
    --rule-soft:  #261F35;
    --accent:     #FF6E62;
    --accent-2:   #FFC24D;
    --accent-wash:#3B2029;
    --on-accent:  #1A0F10;
    --on-accent-2:#1A1725;

    --panel-bg:    #2A2438;
    --panel-fg:    #F2ECE4;
    --panel-accent:#FFC24D;
    --strong:     #47C79C;
    --strong-wash:#123328;
    --okay:       #E7AB4C;
    --okay-wash:  #33260F;
    --weak:       #948AA6;
    --weak-wash:  #292335;
    --shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
    --shadow-up: 0 6px 0 rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-ui);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
  p { margin: 0 0 0.85em; }
  p:last-child { margin-bottom: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 26px 100px; }

  .kicker {
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ---------- masthead ---------- */

  .top { padding: 56px 0 8px; text-align: center; }
  .top .flag {
    display: inline-block;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 6px 14px;
    transform: rotate(-1.4deg);
  }
  .top h1 {
    font-family: var(--f-display);
    font-size: clamp(2.8rem, 9vw, 5.6rem);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.92;
    margin: 20px 0 0;
  }
  .top h1 .zap { color: var(--accent); }
  .top .tag {
    margin: 20px auto 0;
    max-width: 46ch;
    font-size: 1.12rem;
    color: var(--ink-2);
  }

  /* ---------- menu ---------- */

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
    gap: 20px;
    margin-top: 46px;
  }
  .pick {
    position: relative;
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 24px 22px 26px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
  }
  .pick:hover { transform: translate(-2px, -4px); box-shadow: var(--shadow-up); }
  .pick:active { transform: translate(0, 0); box-shadow: var(--shadow); }
  .pick .num {
    position: absolute;
    top: -2px;
    right: -2px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--f-display);
    font-size: 15px;
    font-weight: 800;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
  }
  .pick .chip {
    align-self: flex-start;
    background: var(--accent-wash);
    color: var(--accent);
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 4px 9px;
  }
  .pick h3 {
    font-family: var(--f-display);
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.08;
    padding-right: 30px;
  }
  .pick p { font-size: 0.93rem; color: var(--ink-2); margin: 0; }
  .pick .done {
    margin-top: 2px;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--strong);
    font-weight: 500;
  }

  .how {
    margin-top: 48px;
    padding: 28px 30px 30px;
    background: var(--panel-bg);
    color: var(--panel-fg);
    max-width: 640px;
  }
  .how h4 {
    font-family: var(--f-display);
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin-bottom: 14px;
    color: var(--panel-accent);
  }
  .how ol { margin: 0; padding-left: 20px; }
  .guidelink { margin: 18px 0 0; font-size: 0.93rem; }
  .guidelink a { color: var(--panel-accent); text-underline-offset: 4px; }
  .how li { font-size: 0.95rem; margin-bottom: 8px; opacity: 0.88; }
  .how li:last-child { margin-bottom: 0; }

  /* ---------- play chrome ---------- */

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 22px 0 16px;
  }
  .bar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .linkish {
    background: none;
    border: none;
    padding: 0;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .linkish:hover { color: var(--accent); }
  .rounds { display: flex; gap: 5px; }
  .seg {
    width: 34px;
    height: 7px;
    background: var(--rule);
    border: 1px solid var(--ink);
  }
  .seg.done { background: var(--accent); }
  .seg.now { background: var(--accent-2); }

  .brief {
    padding: 22px 26px 24px;
    background: var(--panel-bg);
    color: var(--panel-fg);
    max-width: 78ch;
    border-left: 6px solid var(--panel-accent);
  }
  .brief .kicker { display: block; margin-bottom: 9px; color: var(--panel-accent); }
  .brief p { font-size: 1rem; opacity: 0.92; }

  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr);
    gap: 44px;
    margin-top: 34px;
    align-items: start;
  }

  .step-head { margin-bottom: 22px; }
  .step-head .job {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .step-head h2 {
    font-family: var(--f-display);
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    margin: 10px 0 0;
  }
  .step-head .prompt { margin-top: 13px; color: var(--ink-2); font-size: 0.98rem; max-width: 54ch; }

  /* ---------- tiles ---------- */

  .tiles { display: flex; flex-direction: column; gap: 13px; }
  .tile {
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 16px;
    align-items: start;
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 17px 20px;
    font-size: 0.98rem;
    line-height: 1.5;
    transition: transform 0.13s ease, box-shadow 0.13s ease, background 0.13s ease;
  }
  .tile:hover { transform: translate(-2px, -4px); box-shadow: var(--shadow-up); background: var(--accent-wash); }
  .tile:active { transform: translate(0, 0); box-shadow: var(--shadow); }
  .tile .key {
    font-family: var(--f-display);
    font-size: 1rem;
    font-weight: 800;
    background: var(--ink);
    color: var(--paper);
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
  }
  .tile:hover .key { background: var(--accent); }

  .hint {
    margin-top: 20px;
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-3);
  }

  /* ---------- draft ---------- */

  .preview { position: sticky; top: 22px; }
  .draft { background: var(--surface); border: 2px solid var(--ink); box-shadow: var(--shadow); }
  .draft-top {
    padding: 11px 20px;
    background: var(--panel-bg);
    color: var(--panel-fg);
    font-family: var(--f-mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .draft-top span:last-child { color: var(--panel-accent); }
  .draft-meta {
    padding: 14px 20px;
    border-bottom: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: 11.5px;
    line-height: 1.85;
    color: var(--ink-3);
  }
  .draft-meta b { color: var(--ink); font-weight: 500; }
  .draft-meta .empty { opacity: 0.55; }
  .draft-body { padding: 18px 20px 22px; font-family: var(--f-mail); font-size: 0.95rem; line-height: 1.6; }
  .draft-body .line { margin-bottom: 0.85em; }
  .draft-body .line:last-child { margin-bottom: 0; }
  .draft-body .slot {
    border: 2px dashed var(--rule);
    padding: 10px 12px;
    color: var(--ink-3);
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .pop { animation: pop 0.32s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }

  /* ---------- reveal ---------- */

  .result { max-width: 800px; margin: 10px auto 0; }
  .bigscore { text-align: center; padding: 26px 0 6px; }
  .bigscore .n {
    font-family: var(--f-display);
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 800;
    letter-spacing: -0.06em;
    line-height: 0.85;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    display: block;
  }
  .bigscore .of {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .perfect {
    display: inline-block;
    margin-top: 16px;
    background: var(--accent-2);
    color: var(--on-accent-2);
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 7px 15px;
    transform: rotate(-1.5deg);
  }
  .result h2 {
    font-family: var(--f-display);
    font-size: clamp(1.7rem, 4.4vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    text-align: center;
    margin-top: 22px;
  }

  .reply {
    margin-top: 26px;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
  }
  .reply .rt {
    padding: 11px 20px;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .reply .rb { padding: 20px; font-family: var(--f-mail); font-size: 1rem; line-height: 1.6; }

  .full-mail { margin-top: 26px; background: var(--surface); border: 2px solid var(--ink); }

  .review { margin-top: 44px; }
  .review > h3 {
    font-family: var(--f-display);
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.035em;
  }
  .review > p { color: var(--ink-2); font-size: 0.95rem; margin: 6px 0 22px; }

  .row {
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 20px 22px 22px;
    margin-bottom: 16px;
  }
  .row .rhead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .row .part {
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .badge {
    font-family: var(--f-mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 2px solid;
  }
  .badge.b0 { color: var(--weak); border-color: var(--weak); background: var(--weak-wash); }
  .badge.b1 { color: var(--okay); border-color: var(--okay); background: var(--okay-wash); }
  .badge.b2 { color: var(--strong); border-color: var(--strong); background: var(--strong-wash); }

  .row .yours {
    font-family: var(--f-mail);
    font-size: 0.98rem;
    line-height: 1.55;
    padding: 12px 16px;
    border-left: 5px solid var(--rule);
    background: var(--surface-2);
  }
  .row.g0 .yours { border-left-color: var(--weak); }
  .row.g1 .yours { border-left-color: var(--okay); }
  .row.g2 .yours { border-left-color: var(--strong); }
  .row .note { margin-top: 13px; font-size: 0.94rem; color: var(--ink-2); }
  .row .best {
    margin-top: 15px;
    padding: 14px 16px;
    background: var(--strong-wash);
    border: 2px dashed var(--strong);
  }
  .row .best b {
    display: block;
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--strong);
    margin-bottom: 7px;
  }
  .row .best span { font-family: var(--f-mail); font-size: 0.95rem; line-height: 1.5; }

  .rise { animation: rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 38px; }
  .go {
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 13px 26px;
    font-family: var(--f-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: transform 0.13s ease, box-shadow 0.13s ease;
  }
  .go:hover { transform: translate(-2px, -4px); box-shadow: var(--shadow-up); }
  .go:active { transform: none; box-shadow: var(--shadow); }
  .go.ghost { background: var(--surface); color: var(--ink); }

  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; gap: 30px; }
    .preview { position: static; }
  }
  @media (max-width: 600px) {
    body { font-size: 16px; }
    .wrap { padding: 0 18px 70px; }
    .top { padding: 36px 0 4px; }
    .tile { grid-template-columns: 32px 1fr; gap: 12px; padding: 15px 16px; }
    .tile .key { width: 26px; height: 26px; font-size: 0.85rem; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, .pop, .rise { animation: none !important; transition: none !important; }
  }
</style>
</head>

<div class="wrap">
  <div id="app"></div>
</div>

<script>
const SCENARIOS = [
  {
    id: "assessment",
    name: "The missing assessment",
    tone: "Warm",
    blurb: "A good student has gone quiet a week after a deadline.",
    student: "Sarah Mitchell",
    brief: "Sarah is a full-time nurse, four weeks into her first term. She was active every week until Week 3, then stopped. Her Week 4 assessment was due eight days ago and nothing has come through. Nobody has contacted her about it yet.",
    steps: [
      {
        part: "Subject line",
        job: "Make the promise",
        prompt: "Sarah will see this in a list of forty other emails on her phone. Pick the subject line.",
        tiles: [
          { tier: 0, text: "Following up", why: "It could sit on top of any email you have ever sent. It tells her nothing about what this is, and 'following up' reads as a chase, which is exactly what someone avoiding you will not open." },
          { tier: 1, text: "Week 4 assessment: action required", why: "Specific, which is a real improvement. But 'action required' is the language of a debt collector, and it puts her on the back foot before she has opened anything." },
          { tier: 2, text: "Getting your Week 4 assessment sorted", why: "Names the exact thing and frames it as help rather than a chase. She knows what it is, that it involves her, and that you are on her side, all before opening it." }
        ]
      },
      {
        part: "First line",
        job: "Get to the point",
        prompt: "If she reads one line and closes the email, this is the line. Pick it.",
        tiles: [
          { tier: 0, text: "I hope this email finds you well. I am writing to follow up on my previous correspondence regarding your progress in the course.", why: "Two sentences that say nothing. By the time she reaches actual information she has already decided this is a form letter and can wait." },
          { tier: 1, text: "I am writing about your Week 4 assessment, which was due on 8 August.", why: "Gets there, and she knows the topic. But it is a statement of fact with no direction, so she still does not know whether this is help or trouble." },
          { tier: 2, text: "Your Week 4 assessment hasn't come through yet, and I'd like to help you get it in.", why: "The problem and your intent, in one sentence. If she reads nothing else she knows what this is about and that you are helping, not chasing." }
        ]
      },
      {
        part: "The middle",
        job: "Only what she needs",
        prompt: "You have about two sentences before she stops reading. Pick what goes in them.",
        tiles: [
          { tier: 0, text: "As per our records, you have not submitted the Week 4 assessment due 8 August, nor completed the Week 3 discussion post. Failure to submit assessments can impact your progression and may affect your eligibility to continue.", why: "Two problems instead of one, and a threat. Leading with consequences triggers avoidance in exactly the student who most needs to reply. Save it for when a warmer approach has already failed." },
          { tier: 1, text: "The assessment was due on 8 August and is now a week overdue. Late submissions can still be marked.", why: "Accurate and it does contain the useful bit, that late work still counts. But it is all admin and does nothing about the reason she has gone quiet." },
          { tier: 2, text: "Week 4 is where a lot of people hit a wall, so you're in good company, and it's fixable.", why: "One sentence saying this is normal and temporary. This is the highest leverage line in the whole email, because what is stopping her is not the deadline, it is the feeling that she is the only one falling behind." }
        ]
      },
      {
        part: "The ask",
        job: "One thing, clearly",
        prompt: "This is what you actually want her to do. Pick it.",
        tiles: [
          { tier: 0, text: "Please advise as to your intentions at your earliest convenience. Additionally, please ensure your contact details are up to date in the student portal.", why: "Two asks, neither with a date, and 'advise your intentions' asks her to make a decision she is not ready to make. You will get the easy one, or nothing." },

const GRADES = ["Weak", "Okay", "Strong"];
const KEYS = ["A", "B", "C"];
const app = document.getElementById("app");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = {
  screen: "menu",
  scenario: null,
  step: 0,
  picks: [],
  order: [],
  justPicked: false,
  best: {}
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function shuffled(n) {
  const a = [...Array(n).keys()];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function total() {
  return state.picks.reduce((s, p) => s + p.tier, 0);
}

function band(score) {
  if (score >= 8) return "strong";
  if (score >= 5) return "mixed";
  return "weak";
}

function renderMenu() {
  const cards = SCENARIOS.map((s, i) => `
    <button class="pick" data-go="${i}">
      <span class="num">${i + 1}</span>
      <span class="chip">${esc(s.tone)}</span>
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.blurb)}</p>
      ${state.best[s.id] !== undefined ? `<span class="done">Best so far: ${state.best[s.id]} out of 10</span>` : ""}
    </button>`).join("");

  app.innerHTML = `
    <div class="top">
      <span class="flag">Advisor email training</span>
      <h1>Build the <span class="zap">Email</span></h1>
      <p class="tag">A situation lands in your inbox. Build the reply one line at a time. No hints, no scores, no idea how you are doing until you hit send.</p>
    </div>
    <div class="menu-grid">${cards}</div>
    <div class="how">
      <h4>How it works</h4>
      <ol>
        <li>Pick a situation and read what has landed on your desk.</li>
        <li>Five rounds, one for each part of an email: subject line, first line, the middle, the ask, the close.</li>
        <li>Three options a round. Pick one and it goes straight into your draft. You get no feedback and no running score.</li>
        <li>Hit send and everything is revealed at once: your score, every line graded, and why.</li>
        <li>Then you find out what your student actually did.</li>
      </ol>
      <p class="guidelink"><a href="guide.html">Read the full guide behind this game</a></p>
    </div>`;

  app.querySelectorAll("[data-go]").forEach(b => {
    b.addEventListener("click", () => startScenario(Number(b.dataset.go)));
  });
}

function startScenario(i) {
  state.scenario = SCENARIOS[i];
  state.step = 0;
  state.picks = [];
  state.justPicked = false;
  state.order = shuffled(3);
  state.screen = "play";
  render();
}

function draftHtml() {
  const sc = state.scenario;
  const subject = state.picks[0]
    ? `<b>${esc(state.picks[0].text)}</b>`
    : `<span class="empty">not written yet</span>`;

  const lines = [];
  if (state.picks.length > 0) {
    lines.push(`<div class="line">Hi ${esc(sc.student.split(" ")[0])},</div>`);
  }
  for (let i = 1; i < 5; i++) {
    if (state.picks[i]) {
      const fresh = state.justPicked && i === state.step - 1 && !reduceMotion;
      lines.push(`<div class="line${fresh ? " pop" : ""}">${esc(state.picks[i].text)}</div>`);
    } else if (i === state.step) {
      lines.push(`<div class="line slot">${esc(sc.steps[i].part)} goes here</div>`);
    }
  }
  if (lines.length === 0) {
    lines.push(`<div class="line slot">Nothing written yet</div>`);
  }

  return `
    <div class="preview">
      <div class="draft">
        <div class="draft-top"><span>Your draft</span><span>Round ${state.step + 1} of 5</span></div>
        <div class="draft-meta">
          <div>To: <b>${esc(sc.student)}</b></div>
          <div>Subject: ${subject}</div>
        </div>
        <div class="draft-body">${lines.join("")}</div>
      </div>
    </div>`;
}

function renderPlay() {
  const sc = state.scenario;
  const st = sc.steps[state.step];

  const segs = sc.steps.map((_, i) => {
    const cls = i < state.step ? "seg done" : i === state.step ? "seg now" : "seg";
    return `<span class="${cls}"></span>`;
  }).join("");

  const tiles = state.order.map((idx, pos) => {
    const t = st.tiles[idx];
    return `<button class="tile" data-tile="${idx}">
      <span class="key">${KEYS[pos]}</span>
      <span>${esc(t.text)}</span>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="bar">
      <div class="bar-left">
        <button class="linkish" id="quit">All situations</button>
        <span class="kicker">${esc(sc.name)}</span>
      </div>
      <div class="rounds">${segs}</div>
    </div>

    <div class="brief">
      <span class="kicker">The situation</span>
      <p>${esc(sc.brief)}</p>
    </div>

    <div class="stage">
      <div>
        <div class="step-head">
          <div class="job">Round ${state.step + 1} of 5 &middot; ${esc(st.job)}</div>
          <h2>${esc(st.part)}</h2>
          <p class="prompt">${esc(st.prompt)}</p>
        </div>
        <div class="tiles">${tiles}</div>
        <div class="hint">Press A, B or C to choose</div>
      </div>
      ${draftHtml()}
    </div>`;

  app.querySelector("#quit").addEventListener("click", () => { state.screen = "menu"; render(); });
  app.querySelectorAll("[data-tile]").forEach(b => {
    b.addEventListener("click", () => choose(Number(b.dataset.tile)));
  });
}

function choose(idx) {
  const t = state.scenario.steps[state.step].tiles[idx];
  state.picks[state.step] = { index: idx, tier: t.tier, text: t.text, why: t.why };

  if (state.step === 4) {
    const id = state.scenario.id;
    const s = total();
    if (state.best[id] === undefined || s > state.best[id]) state.best[id] = s;
    state.screen = "result";
    state.justPicked = false;
  } else {
    state.step += 1;
    state.justPicked = true;
    state.order = shuffled(3);
  }
  render();
}

function countUp(el, target) {
  if (reduceMotion || target === 0) { el.textContent = target; return; }
  const dur = 700;
  const start = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function renderResult() {
  const sc = state.scenario;
  const score = total();
  const out = sc.outcomes[band(score)];

  const rows = sc.steps.map((st, i) => {
    const p = state.picks[i];
    const bestTile = st.tiles.find(t => t.tier === 2);
    const showBest = p.tier < 2;
    const delay = reduceMotion ? "" : ` style="animation-delay:${0.5 + i * 0.09}s"`;
    return `
      <div class="row g${p.tier} rise"${delay}>
        <div class="rhead">
          <span class="part">${esc(st.part)}</span>
          <span class="badge b${p.tier}">${GRADES[p.tier]} &middot; ${p.tier} ${p.tier === 1 ? "pt" : "pts"}</span>
        </div>
        <div class="yours">${esc(p.text)}</div>
        <div class="note">${esc(p.why)}</div>
        ${showBest ? `<div class="best"><b>The strongest option was</b><span>${esc(bestTile.text)}</span></div>` : ""}
      </div>`;
  }).join("");

  const emailLines = state.picks.slice(1).map(p => `<div class="line">${esc(p.text)}</div>`).join("");
  const d = n => reduceMotion ? "" : ` style="animation-delay:${n}s"`;

  app.innerHTML = `
    <div class="bar">
      <div class="bar-left">
        <button class="linkish" id="quit">All situations</button>
        <span class="kicker">${esc(sc.name)} &middot; the reveal</span>
      </div>
    </div>

    <div class="result">
      <div class="bigscore rise">
        <span class="n" id="tally">0</span>
        <span class="of">out of 10</span>
        ${score === 10 ? `<div class="perfect">Perfect email</div>` : ""}
      </div>

      <h2 class="rise"${d(0.2)}>${esc(out.verdict)}</h2>

      <div class="reply rise"${d(0.3)}>
        <div class="rt">${esc(sc.student)} replied</div>
        <div class="rb">${esc(out.reply)}</div>
      </div>

      <div class="full-mail rise"${d(0.4)}>
        <div class="draft-top"><span>What you sent</span><span>${score} of 10</span></div>
        <div class="draft-meta">
          <div>To: <b>${esc(sc.student)}</b></div>
          <div>Subject: <b>${esc(state.picks[0].text)}</b></div>
        </div>
        <div class="draft-body">
          <div class="line">Hi ${esc(sc.student.split(" ")[0])},</div>
          ${emailLines}
        </div>
      </div>

      <div class="review">
        <h3 class="rise"${d(0.45)}>Line by line</h3>
        <p class="rise"${d(0.48)}>What each choice was doing, and the strongest version of anything you missed.</p>
        ${rows}
      </div>

      <div class="actions">
        <button class="go" id="again">Play this one again</button>
        <button class="go ghost" id="quit2">Pick another situation</button>
      </div>
    </div>`;

  countUp(app.querySelector("#tally"), score);
  app.querySelector("#again").addEventListener("click", () => startScenario(SCENARIOS.indexOf(sc)));
  app.querySelector("#quit").addEventListener("click", () => { state.screen = "menu"; render(); });
  app.querySelector("#quit2").addEventListener("click", () => { state.screen = "menu"; render(); });
}

document.addEventListener("keydown", e => {
  if (state.screen !== "play") return;
  const k = e.key.toUpperCase();
  let pos = KEYS.indexOf(k);
  if (pos === -1 && "123".includes(k)) pos = Number(k) - 1;
  if (pos === -1) return;
  e.preventDefault();
  choose(state.order[pos]);
});

function render() {
  if (state.screen === "menu") renderMenu();
  else if (state.screen === "play") renderPlay();
  else renderResult();
  window.scrollTo({ top: 0, behavior: "instant" });
}

render();
</script>

</body>
</html>
